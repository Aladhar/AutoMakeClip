[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "automakeclip"
version = "0.1.0"
description = "Auto-cut Overwatch gameplay VODs into music-backed highlight reels."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.24,<3",
  "yt-dlp>=2024.12.13",
]

[project.scripts]
automakeclip = "automakeclip.cli:main"
automakeclip-review = "automakeclip.review:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
